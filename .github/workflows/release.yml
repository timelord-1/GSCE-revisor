name: Build and publish desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.5.0
permissions:
  contents: write
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run papers:download
      - run: npm run papers:check
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python scripts/verify-past-papers.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test browser interactions
        run: |
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          npm run test:ui
  windows-build:
    needs: browser-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run papers:download
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python scripts/verify-past-papers.py
      - run: npm test
      - run: npm run build:win
      - name: Exercise the packaged Windows app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/win-unpacked/Trilogy Revision.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "Desktop smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          if-no-files-found: error
          path: |
            dist/Trilogy-Revision-*-Windows-x64.exe
            dist/PAPER-VERIFICATION.json
  linux-build:
    needs: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run papers:download
      - run: npm test
      - run: npm run build:linux
      - name: Install the native Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgbm1 ./dist/Trilogy-Revision-*-Linux-x64.deb
          dpkg-query -W trilogy-revision
          test -x /usr/bin/trilogy-revision
      - name: Exercise the installed Linux app and fractional display scaling
        run: |
          timeout 45s xvfb-run -a --server-args="-screen 0 1920x1440x24" trilogy-revision --smoke-test --force-device-scale-factor=1.25
          timeout 45s xvfb-run -a --server-args="-screen 0 2560x1800x24" trilogy-revision --smoke-test --force-device-scale-factor=2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          if-no-files-found: error
          path: dist/Trilogy-Revision-*-Linux-x64.deb
  publish:
    needs: [windows-build, linux-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: dist
          merge-multiple: true
      - name: Record checksums and publish both tested packages
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha256sum -- *.exe *.deb > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.exe ./*.deb SHA256SUMS.txt PAPER-VERIFICATION.json --clobber
          else
            gh release create "$RELEASE_TAG" ./*.exe ./*.deb SHA256SUMS.txt PAPER-VERIFICATION.json --verify-tag --title "Trilogy Revision $RELEASE_TAG" --notes-file ../docs/RELEASE.md
          fi
