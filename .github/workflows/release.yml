name: Build and publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        default: v1.3.0
permissions:
  contents: write
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run papers:download
      - run: npm run papers:check
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python scripts/verify-past-papers.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  windows-release:
    needs: browser-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run papers:download
      - run: npm run papers:check
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python scripts/verify-past-papers.py
      - run: npm test
      - run: npm run build:win
      - name: Exercise the packaged Windows app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/win-unpacked/Trilogy Revision.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "Desktop smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($process.ExitCode)" }
      - name: Record checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem dist/Trilogy-Revision-*-Windows-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/Trilogy-Revision-*-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/PAPER-VERIFICATION.json
      - name: Publish executable in Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $asset = (Get-ChildItem dist/Trilogy-Revision-*-Windows-x64.exe | Select-Object -First 1).FullName
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$asset" dist/SHA256SUMS.txt dist/PAPER-VERIFICATION.json --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$asset" dist/SHA256SUMS.txt dist/PAPER-VERIFICATION.json --verify-tag --title "Trilogy Revision $env:RELEASE_TAG" --notes-file docs/RELEASE.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
